[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "token-optimizer"
version = "0.1.0"
description = "Claude API token reduction toolkit"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.92.0",
    "textual>=0.61.0",
]

[project.scripts]
claude-team = "token_optimizer.team:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["token_optimizer*"]
