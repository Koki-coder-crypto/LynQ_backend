name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write        # push tags, create releases
  id-token: write        # PyPI trusted publishing

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    concurrency: release
    # Only run if CI passed
    needs: []

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history for semantic-release
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install semantic-release + build tools
        run: pip install python-semantic-release build

      - name: Run semantic-release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          semantic-release version --no-vcs-release 2>&1 || true
          semantic-release publish 2>&1 || true

      - name: Build package
        run: python -m build

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
        continue-on-error: true   # non-fatal until PyPI trusted publisher is configured
